name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build --file docker/Dockerfile --tag obscuraj:ci .

      - name: Verify container runtime and CLI
        run: |
          docker run --rm obscuraj:ci /usr/local/bin/obscuraj-runtime-check
          docker run --rm obscuraj:ci bash /app/cli/obscuraj.sh --help

      - name: Verify API startup and health
        run: |
          docker run --rm -d --name obscuraj-ci -p 127.0.0.1:19191:19191 obscuraj:ci
          trap 'docker stop obscuraj-ci >/dev/null' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:19191/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs obscuraj-ci
          exit 1
